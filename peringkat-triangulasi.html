/* Layout: lembar baca kritik — grafik sebar di kiri, kartu cerpen di kanan; bertumpuk di layar sempit */
:root{

.grid{display:grid;grid-template-columns:1fr;gap:12px}
.card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);column-gap:22px;align-items:start}
.card .side{min-width:0}
@media (max-width:620px){.card{grid-template-columns:1fr}}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;min-width:0}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.tools label{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
#q{font:inherit;font-size:.95rem;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);min-width:0;flex:1 1 220px}

svg{display:block;width:100%;height:auto}
svg text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.dot{cursor:pointer;transition:r .15s}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-family:var(--mono);font-size:.75rem;color:var(--muted);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--c)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0;font-size:15px}
.card h2{margin:.2rem 0 .1rem;font-size:1.4rem;line-height:1.2;text-wrap:balance}
.meta{color:var(--muted);font-size:.95rem}
.big{display:flex;align-items:baseline;gap:10px;margin:10px 0 4px}
.big b{font-family:var(--mono);font-size:2rem;color:var(--accent);font-variant-numeric:tabular-nums}
.big small{font-family:var(--mono);color:var(--muted);font-size:.78rem}
.bars{display:grid;gap:8px;margin:10px 0 14px}
.bar{display:grid;grid-template-columns:8.5rem 1fr 3rem;gap:8px;align-items:center;font-family:var(--mono);font-size:.78rem}
.bar .track{height:9px;background:var(--line);border-radius:5px;overflow:hidden}
.bar .track{display:block}.bar .fill{display:block;height:100%;background:var(--c)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}

blockquote .n{font-style:normal;font-family:var(--mono);font-size:.72rem;color:var(--muted);display:block;margin-top:4px}
.method{color:var(--muted);font-size:.95rem;max-width:72ch}
.method b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.dot{transition:none}}
</style>
</head>

const svg = document.getElementById('chart'), card = document.getElementById('card');
const W=720,H=400,L=52,R=16,T=16,B=44, N=DATA.length;
const X = r => L + (r-1)/(N-1)*(W-L-R);
const Y = v => T + (1-v)*(H-T-B);
const ns='http://www.w3.org/2000/svg';
const fmt = (v,d=3) => v.toFixed(d).replace('.',',');
function el(tag,attrs,parent){const e=document.createElementNS(ns,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||svg).appendChild(e);return e}
let sel = 0, dots = [];
function draw(){
  svg.textContent='';
  for(let v=0; v<=1.0001; v+=0.2){ const y=Y(v); el('line',{x1:L,x2:W-R,y1:y,y2:y,stroke:'var(--line)'}); const t=el('text',{x:L-8,y:y+4,'text-anchor':'end'}); t.textContent=fmt(v,1); }
  [1,20,40,60,80,100,120,138].forEach(r=>{const t=el('text',{x:X(r),y:H-B+18,'text-anchor':'middle'});t.textContent='#'+r});
  const xl=el('text',{x:(W+L)/2,y:H-6,'text-anchor':'middle'}); xl.textContent='peringkat kandidat';
  const yl=el('text',{x:14,y:(H-B+T)/2,'text-anchor':'middle',transform:`rotate(-90 14 ${(H-B+T)/2})`}); yl.textContent='skor triangulasi (0–1)';
  dots = DATA.map((d,i)=>{
    const top=d.rank<=5;
    const c=el('circle',{cx:X(d.rank),cy:Y(d.skor),r:top?7:4.5,fill:top?'var(--accent)':'var(--dot)',class:'dot',tabindex:0,'aria-label':`#${d.rank} ${d.judul}, ${d.penulis}, skor ${fmt(d.skor)}`});
    const ttl=el('title',{},c); ttl.textContent=`#${d.rank} ${d.judul} — ${d.penulis} (${fmt(d.skor)})`;
    c.addEventListener('mouseenter',()=>show(i)); c.addEventListener('click',()=>show(i)); c.addEventListener('focus',()=>show(i));
    return c;
  });
  DATA.slice(0,5).forEach((d,k)=>{
    const lx=X(44), ly=T+16+k*19;
    el('line',{x1:X(d.rank)+6,y1:Y(d.skor),x2:lx-4,y2:ly-4,stroke:'var(--muted)','stroke-width':.6,opacity:.6});
    const t=el('text',{x:lx,y:ly,style:'fill:var(--accent);font-weight:600'}); t.textContent=`#${d.rank} ${d.judul.length>30?d.judul.slice(0,28)+'…':d.judul} · ${fmt(d.skor)}`;
  });
}
function show(i){
  sel=i; const d=DATA[i];
  dots.forEach((c,j)=>{const top=DATA[j].rank<=5; c.setAttribute('fill', j===i?'var(--steel)':(top?'var(--accent)':'var(--dot)')); c.setAttribute('r', j===i?9:(top?7:4.5));});
  const bar=(lab,v,c)=>`<div class="bar"><span>${lab}</span><span class="track"><span class="fill" style="width:${v*100}%;--c:${c}"></span></span><span class="v">${fmt(v,2)}</span></div>`;
  card.innerHTML = `<div class="side"><div class="eyebrow">Peringkat #${d.rank} dari ${N}</div>
   <h2>${esc(d.judul)}</h2><div class="meta">${esc(d.penulis)} · ${esc(d.tahun)}</div>
   <div class="big"><b>${fmt(d.skor)}</b><small>skor akhir triangulasi</small></div>
   <div class="bars">${bar('Kepadatan kata',d.kepadatan,'var(--dot)')}${bar('Skor kalimat',d.kalimat,'var(--steel)')}${bar('Kemiripan makna',d.makna,'var(--gold)')}</div>
   <div class="meta">Jumlah nilai sepuluh kalimat terkuat: ${d.skor_kalimat}; kalimat bertema: ${d.kalimat_bertema}.</div></div>
   <div class="side">${d.contoh.map(c=>{const t=clean(c.teks);return `<blockquote>“${esc(t)}${c.teks.length>=280?'…':''}”<span class="n">nilai kalimat ${c.nilai}</span></blockquote>`}).join('')}</div>`;
}
function clean(t){return String(t).trim().replace(/^[“"']+/,'').replace(/[”"']+$/,'')}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
draw(); show(0);
